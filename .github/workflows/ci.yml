name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run typecheck:examples
      - run: npm run check:type-docs
      - run: npm run check:export-parity
      - run: npm run smoke:pack
      - run: npm run typecheck:docs
      - run: npm run check:snippets
      - run: npm run check:placeholders
      - run: npm run check:agent-rules
      - run: npm run docs:build
      # The committed llms.txt is written by docs:build. A difference means
      # the pages under docs/ changed and it was not regenerated.
      - name: llms.txt is current
        run: git diff --exit-code -- llms.txt
